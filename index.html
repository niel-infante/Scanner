<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tube Scan">
  <title>Tube Scanner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="viewer">
    <video id="video" playsinline muted autoplay></video>
    <div id="reticle" aria-hidden="true"><span></span></div>
    <p id="status" role="status">Loading…</p>
    <p id="info"></p>

    <button id="start" class="primary big">Start camera</button>

    <div id="controls">
      <select id="camera" hidden aria-label="Camera"></select>
      <label id="zoom-wrap" class="slider" hidden>
        <span>Zoom</span>
        <input id="zoom" type="range" min="1" max="1" step="0.1" value="1">
        <output id="zoom-val">1×</output>
      </label>
      <div id="focus-wrap" class="slider" hidden>
        <label for="focus">Focus</label>
        <input id="focus" type="range" min="0" max="1" step="0.01" value="0">
        <button id="focus-auto" type="button" aria-pressed="true">Auto</button>
      </div>
      <div class="row">
        <button id="torch" hidden aria-pressed="false">Light</button>
        <label class="button" id="snap-label">
          Snap photo
          <input id="snap" type="file" accept="image/*" capture="environment" hidden>
        </label>
        <button id="history-btn">History</button>
      </div>
    </div>
  </main>

  <section id="result" hidden aria-live="assertive">
    <p class="label">Tube barcode</p>
    <p id="result-text"></p>
    <p id="result-note"></p>
    <div class="row">
      <button id="copy" class="primary">Copy</button>
      <button id="next">Scan next</button>
    </div>
  </section>

  <section id="history" hidden>
    <header class="row">
      <h2>Recent reads</h2>
      <button id="history-close">Close</button>
    </header>
    <p class="hint">Tap a value to copy it.</p>
    <ol id="history-list"></ol>
    <button id="history-clear">Clear history</button>
  </section>
</body>
</html>
